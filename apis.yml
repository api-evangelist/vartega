description: Vartega is a Denver, Colorado-based advanced materials company that produces
  recycled carbon fiber (rCF) from post-industrial scrap as a sustainable, lower-cost
  drop-in alternative to virgin carbon fiber. Its product line includes EasyFeed Bundles
  for thermoplastic compounding, chopped carbon fiber in multiple lengths and sizings,
  and carbon fiber reinforced polypropylene and nylon pellets. Added to the API Evangelist
  network as a Techstars portfolio company; enrichment probing found no public developer
  API, SDK, developer portal, or event surface.
